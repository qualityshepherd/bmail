<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="wax" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#D96828"/>
      <stop offset="100%" stop-color="#9C3A08"/>
    </radialGradient>
  </defs>
  <!-- Wax seal body -->
  <circle cx="16" cy="16" r="15.5" fill="url(#wax)"/>
  <!-- Rope ring (outer) -->
  <circle cx="16" cy="16" r="12.5" fill="none" stroke="#E08040" stroke-width="1.3" stroke-dasharray="2.2 1.4"/>
  <!-- Rope ring (inner) -->
  <circle cx="16" cy="16" r="10.8" fill="none" stroke="#C05018" stroke-width="0.7"/>
  <!-- Embossed B -->
  <text x="16" y="22.5"
        font-family="Georgia,'Times New Roman',serif"
        font-size="19" font-weight="bold"
        text-anchor="middle"
        fill="#F8DEB8"
        opacity="0.92">B</text>
</svg>
